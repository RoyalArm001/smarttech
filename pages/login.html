<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Smart Tech</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.8);
        --panel-border: rgba(148, 163, 184, 0.28);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --error: #fca5a5;
        --success: #86efac;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020617, #0f172a 35%, #111827);
        color: var(--text);
      }
      .card {
        width: min(100%, 420px);
        padding: 2rem;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.45);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
      }
      .sub {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      label {
        display: block;
        margin: 0 0 0.7rem;
        font-size: 0.96rem;
        color: var(--muted);
      }
      input {
        width: 100%;
        display: block;
        border: 1px solid var(--panel-border);
        background: rgba(15, 23, 42, 0.92);
        color: var(--text);
        border-radius: 10px;
        padding: 0.9rem 1rem;
        margin-top: 0.35rem;
        font: inherit;
      }
      button {
        width: 100%;
        margin-top: 1.2rem;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #062a26;
        padding: 0.9rem 1rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .message {
        min-height: 1.4rem;
        margin-top: 1rem;
        font-size: 0.92rem;
      }
      .message.error { color: var(--error); }
      .message.success { color: var(--success); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Smart Tech Login</h1>
      <p class="sub">Use your Supabase Auth account to sign in.</p>
      <form id="login-form">
        <label>
          Email
          <input id="email" type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input id="password" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Login</button>
      </form>
      <div id="message" class="message" aria-live="polite"></div>
    </main>

    <script>
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const message = document.getElementById('message');

      function setMessage(text, type) {
        message.textContent = text;
        message.className = 'message ' + (type || '');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          setMessage('Email and password are required.', 'error');
          return;
        }

        try {
          setMessage('Signing in…', '');
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const payload = await response.json();

          if (!response.ok) {
            throw new Error(payload && payload.error ? payload.error : 'Login failed.');
          }

          if (payload && payload.user) {
            localStorage.setItem('smarttech.supabase.user', JSON.stringify(payload.user));
          }

          setMessage('Login successful. Your browser session is now active.', 'success');
          form.reset();
        } catch (error) {
          setMessage(error && error.message ? error.message : 'Unable to sign in.', 'error');
        }
      });
    </script>
  </body>
</html>
