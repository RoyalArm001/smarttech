<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Smart Tech</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.8);
        --panel-border: rgba(148, 163, 184, 0.28);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --error: #fca5a5;
        --success: #86efac;
      }
      * { box-sizing: border-box; }
      body {
        position: relative;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #040a10;
        color: var(--text);
        overflow: hidden;
      }
      .cyber-hacker-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      .card {
        position: relative;
        z-index: 2;
        width: min(100%, 420px);
        padding: 2.2rem;
        background: rgba(8, 20, 30, 0.82);
        border: 1px solid rgba(0, 240, 255, 0.22);
        border-radius: 20px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 240, 255, 0.08), inset 0 1px rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(24px) saturate(140%);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
      }
      .sub {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      label {
        display: block;
        margin: 0 0 0.7rem;
        font-size: 0.96rem;
        color: var(--muted);
      }
      input {
        width: 100%;
        display: block;
        border: 1px solid rgba(0, 240, 255, 0.2);
        background: rgba(15, 23, 42, 0.78);
        color: var(--text);
        border-radius: 12px;
        padding: 0.9rem 1rem;
        margin-top: 0.35rem;
        font: inherit;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      input:focus {
        border-color: #00f0ff;
        box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.18);
      }
      button {
        width: 100%;
        margin-top: 1.2rem;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #00f0ff, #00a896);
        color: #041018;
        padding: 0.9rem 1rem;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 240, 255, 0.25);
        transition: transform 0.18s, box-shadow 0.18s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(0, 240, 255, 0.35);
      }
      .message {
        min-height: 1.4rem;
        margin-top: 1rem;
        font-size: 0.92rem;
      }
      .message.error { color: var(--error); }
      .message.success { color: var(--success); }
    </style>
  </head>
  <body>
    <canvas id="cyber-hacker-bg" class="cyber-hacker-bg" aria-hidden="true"></canvas>
    <main class="card">
      <h1>Smart Tech Login</h1>
      <p class="sub">Use your Supabase Auth account to sign in.</p>
      <form id="login-form">
        <label>
          Email
          <input id="email" type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input id="password" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Login</button>
      </form>
      <div id="message" class="message" aria-live="polite"></div>
    </main>

    <script>
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const message = document.getElementById('message');

      function setMessage(text, type) {
        message.textContent = text;
        message.className = 'message ' + (type || '');
      }

      async function safeParseJson(res) {
        if (!res) return {};
        try {
          const text = await res.text();
          return text ? JSON.parse(text) : {};
        } catch (e) {
          return {};
        }
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          setMessage('Email and password are required.', 'error');
          return;
        }

        try {
          setMessage('Signing in…', '');
          let response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const payload = await safeParseJson(response);

          if (response.ok && payload && payload.user) {
            window.location.assign('/admin');
            return;
          }

          response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const userPayload = await safeParseJson(response);
          if (!response.ok) {
            throw new Error((userPayload && userPayload.error) || (payload && payload.error) || 'Login failed. Check server status or credentials.');
          }
          if (userPayload && userPayload.user && (String(userPayload.user.role || '').toLowerCase() === 'admin' || String(userPayload.user.email || '').toLowerCase() === 'admin@smarttechllc.am')) {
            window.location.assign('/admin');
            return;
          }
          if (userPayload && userPayload.user && userPayload.user.username) {
            window.location.assign('/profile/' + encodeURIComponent(userPayload.user.username));
          } else {
            window.location.assign('/profile');
          }
        } catch (error) {
          setMessage(error && error.message ? error.message : 'Unable to sign in.', 'error');
        }
      });

      (function () {
        // Նախ ստուգել admin session - եթե admin ա, անմիջապես redirect /admin
        fetch('/api/admin/session')
          .then(safeParseJson)
          .then(function (data) {
            if (data && data.authenticated) {
              window.location.replace('/admin');
              return;
            }
            // Admin session չկա, ստուգել user session
            fetch('/api/auth/session')
              .then(safeParseJson)
              .then(function (data) {
                if (data && data.authenticated && data.user && (String(data.user.role || '').toLowerCase() === 'admin' || String(data.user.email || '').toLowerCase() === 'admin@smarttechllc.am')) {
                  window.location.replace('/admin');
                }
              })
              .catch(function () {});
          })
          .catch(function () {
            fetch('/api/auth/session')
              .then(safeParseJson)
              .then(function (data) {
                if (data && data.authenticated && data.user && (String(data.user.role || '').toLowerCase() === 'admin' || String(data.user.email || '').toLowerCase() === 'admin@smarttechllc.am')) {
                  window.location.replace('/admin');
                }
              })
              .catch(function () {});
          });
      })();
    </script>
    <script src="/src/sections/profile/cyber-bg.js"></script>
  </body>
</html>
